name: Gradle bootstrap compilation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Compile port bootstraps
        run: gradle --no-daemon build


      # NOTE: Compiling placeholder code is a development smoke test only.
      # We intentionally do NOT publish stub JARs as downloadable mods.
