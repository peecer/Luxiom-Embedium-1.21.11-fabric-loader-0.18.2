name: Full Luxium-style real graphics pack (not a Luxium port)
on:
  push:
    branches: [main]
    paths:
      - tools/build_luxium_style_pack.py
      - tools/build_compatible_pack.py
      - .github/workflows/luxium-style-pack.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real mod files for Fabric Loader 0.18.2 and shader assets
        run: python tools/build_luxium_style_pack.py --output "dist/Luxium-Style-Graphics-1.21.11-Fabric-0.18.2-NOT-LUXIUM.mrpack"
      - name: Publish validated pack to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Luxium-Style-Fabric-0.18.2-NOT-LUXIUM
          path: dist/*.mrpack
          if-no-files-found: error
      - name: Publish separate GitHub prerelease
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          # Full Luxium-style graphics alternative (NOT Luxium)

          This is a launcher-importable Modrinth pack for Minecraft 1.21.11 and Fabric Loader exactly 0.18.2.
          It uses a real Sodium + Iris pairing, dynamic lights, Fabric API, ImmediatelyFast, Cull Leaves, ModernFix-mVUS, and Complementary Reimagined shaders.

          **Not a Luxium implementation.** No original Luxium shaders, LSR/TFR, Embeddium internals, or renderer code have been ported. Remove any old UNIMPLEMENTED JARs and Compact BedWars HUD 1.3.

          SHA-512, required dependencies, exact Fabric Loader compatibility (including nested Fabric modules) and shader archive presence are CI-checked. The Minecraft client itself was NOT tested. Enable Complementary in Iris settings.
          NOTES
          TAG='luxium-style-fabric-0.18.2-1.21.11'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'Luxium-style graphics alternative (Fabric 0.18.2, NOT Luxium)' --notes-file notes.md --prerelease
          else
            gh release create "$TAG" --title 'Luxium-style graphics alternative (Fabric 0.18.2, NOT Luxium)' --notes-file notes.md --prerelease --target main
          fi
          gh release upload "$TAG" dist/*.mrpack --clobber
